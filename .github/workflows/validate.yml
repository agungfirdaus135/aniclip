name: Validate ANICLIP prototype

on:
  push:
    branches: ["feat/mvp-v0.1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Check required static files
        run: test -s index.html && test -s styles.css && test -s app.js
